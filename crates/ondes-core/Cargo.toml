[package]
name = "ondes-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
lofty = "0.25.5"
parking_lot = "0.13.0"
pgp = "0.21.0"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "native-tls", "gzip", "charset", "system-proxy"] }
rodio = { version = "0.23.0", features = ["symphonia-all"] }
rustypipe = { version = "0.11.4", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
walkdir = "2.5.0"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

<svg xmlns="http://www.w3.org/2000/svg" viewBox="122 193 780 780">
  <!-- yato: a glowing orb resting on water in the mist, ripples spreading from it (no background). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#151729"/>
      <stop offset="1" stop-color="#05050a"/>
    </linearGradient>
    <linearGradient id="iri" gradientUnits="userSpaceOnUse" x1="520" y1="160" x2="860" y2="520">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#9ff3ff"/>
      <stop offset="0.7" stop-color="#b6a2ff"/>
      <stop offset="1" stop-color="#ff9fd2"/>
    </linearGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="132" y1="700" x2="892" y2="700">
      <stop offset="0" stop-color="#a995ff"/>
      <stop offset="0.5" stop-color="#e9fbff"/>
      <stop offset="1" stop-color="#ff9fd2"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#bff6ff"/>
      <stop offset="0.75" stop-color="#a48cff"/>
      <stop offset="1" stop-color="#ff86c8"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#2a1458" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a1458" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="mist" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <radialGradient id="mist-violet"><stop offset="0" stop-color="#6c4dff" stop-opacity="0.45"/><stop offset="1" stop-color="#6c4dff" stop-opacity="0"/></radialGradient>
    <radialGradient id="mist-cyan"><stop offset="0" stop-color="#34c8ff" stop-opacity="0.38"/><stop offset="1" stop-color="#34c8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="mist-pink"><stop offset="0" stop-color="#ff6fb5" stop-opacity="0.25"/><stop offset="1" stop-color="#ff6fb5" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- Mist: soft coloured haze, fading out before the edges (no visible border). -->
  <ellipse cx="430" cy="560" rx="300" ry="260" fill="url(#mist-violet)"/>
  <ellipse cx="640" cy="470" rx="250" ry="210" fill="url(#mist-cyan)"/>
  <ellipse cx="560" cy="740" rx="300" ry="140" fill="url(#mist-pink)"/>
  <!-- Ripples on the water, spreading from where the orb touches it -->
  <g fill="none" stroke="url(#ring)" stroke-linecap="round">
    <ellipse cx="512" cy="700" rx="380" ry="96" stroke-width="10" opacity="0.28"/>
    <ellipse cx="512" cy="700" rx="280" ry="70" stroke-width="16" opacity="0.55"/>
    <ellipse cx="512" cy="700" rx="180" ry="44" stroke-width="22" opacity="0.9"/>
  </g>
  <!-- Glow of the orb on the water -->
  <ellipse cx="512" cy="700" rx="150" ry="34" fill="#cfe9ff" opacity="0.35" filter="url(#soft)"/>
  <!-- The orb -->
  <circle cx="512" cy="520" r="150" fill="url(#orb)"/>
  <circle cx="512" cy="520" r="150" fill="url(#rim)"/>
  <ellipse cx="462" cy="460" rx="62" ry="36" transform="rotate(-35 462 460)" fill="url(#spec)"/>
</svg>

  </g>
  <g transform="translate(512.0 506.0) skewX(-10) translate(-512.0 -506.0)" fill="none" stroke="#ffffff" stroke-width="58" stroke-linecap="butt" stroke-linejoin="round"><path d="M 209.0 389.0 H 816.0"/><path d="M 238.0 389.0 V 488.0 H 298.0 A 82 82 0 0 1 298.0 652.0 H 208.0"/><path d="M 456.0 389.0 V 488.0 H 516.0 A 82 82 0 0 1 516.0 652.0 H 426.0"/><path d="M 674.0 389.0 V 488.0 H 734.0 A 82 82 0 0 1 734.0 652.0 H 644.0"/></g>
